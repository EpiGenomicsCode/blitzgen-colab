# Blitz K16 folding recipe (EpiGenomicsCode/Blitz, --blitz_policy k16).
# Default folding policy for BlitzGen.
#
# Sampler. Blitz hardcodes a 16-value sigma tuple in absolute units; BoltzGen's
# sample_schedule_af3 generates the same curve analytically and multiplies by
# sigma_data (diffusion.py). With sigma_max=160, sigma_min=0.01, rho=40,
# sigma_data=16, N=16 the two agree to ~1e-13 (K8 agrees bit-for-bit), so no
# schedule code is needed -- only the two values changed below vs the k8 recipe.
#
# NOT reproduced here: Blitz's FK steering and terminal clean projection, which
# BoltzGen has no equivalent for (no potentials module, no guidance update). That
# costs the published physical-validity gain (violation rate 26.7% vs teacher
# 30.3%); it does not affect whether the checkpoint runs. Measured on 20 paired
# designs, k16 under this config tracks the Boltz-2 teacher closely:
#   design_to_target_iptm  median shift -0.004, spearman +0.88
#   complex_plddt          median shift +0.002, spearman +0.96
# so filter thresholds derived against the teacher carry over without rescaling.
#
# Full K16 steering policy, for whoever ports it:
#   fk_steering=True, num_particles=1 (so FK resampling is inert), fk_lambda=4.0,
#   fk_resampling_interval=3, physical_guidance_update=True,
#   contact_guidance_update=True, num_gd_steps=20,
#   terminal clean projection: scale 2/27, 10 GD steps.
#   Per-potential guidance weights (these are RETUNED for 16 steps, not the
#   Boltz-2 defaults): VDWOverlap 0.675, SymmetricChainCOM 0.5, Connections 0.15,
#   StereoBond 0.05, PlanarBond 0.05, ChiralAtom scheduled 2.651 -> 0.194 over the
#   15 inner steps, PoseBusters scheduled 0.634 -> 0.040 plus a terminal override
#   to 0.135 below 3/32 of the trajectory.
_target_: boltzgen.task.predict.predict.Predict

debug: false

data:
  _target_: boltzgen.task.predict.data_from_generated.FromGeneratedDataModule
  cfg:
    _target_: boltzgen.task.predict.data_from_generated.DataConfig
    tokenizer:
      _target_: boltzgen.data.tokenize.tokenizer.Tokenizer
      atomize_modified_residues: false
    featurizer:
      _target_: boltzgen.data.feature.featurizer.Featurizer

    suffix: .cif
    suffix_metadata: .npz
    suffix_native: _native.cif
    samples_per_target: 1000000000000000
    num_targets: 10000000000000
    moldir: null

    batch_size: 1
    num_workers: 4
    pin_memory: true
    disulfide_prob: 1.0
    disulfide_on: true
  design_dir: null
  target_templates: true
  return_native: false
  fail_if_no_designs: true
  output_dir: null

keys_dict_out: ["min_interaction_pae", "min_design_to_target_pae", "interaction_pae", "ligand_iptm", "protein_iptm", "iptm", "design_iptm", "design_iiptm", "design_to_target_iptm", "design_residue_iptm", "design_ptm", "target_ptm", "ptm"]

writer:
  _target_: boltzgen.task.predict.writer.FoldingWriter
  design_dir: ${data.design_dir}

trainer:
  accelerator: gpu
  logger: false
  devices: 1
  precision: bf16-mixed

name: null
output: null
checkpoint: null
matmul_precision: null
# Fixed RNG seed for the diffusion sampler. Without it, repeat runs of identical
# inputs differ and a provenance record cannot be reproduced. Override per run
# with --seed; set to null to restore nondeterministic sampling.
seed: 42
deterministic: false
recycling_steps: 5
sampling_steps: 16
diffusion_samples: 5

# Full diffusion_process_args: Predict passes override into
# Boltz.load_from_checkpoint(**override), which replaces the checkpoint's
# diffusion_process_args dict wholesale (no deep-merge). List every knob.
#
# template/msa/pairformer_args: export copies boltz2_conf hparams that include
# use_trifast=True; boltzgen TemplateModule/MSAModule/PairformerModule reject
# that kwarg. Override with the same dicts minus use_trifast (parity smoke
# scripts/boltzgen_student_parity_smoke.py strips the same way).
override:
  validators: null
  template_args:
    template_dim: 64
    template_blocks: 2
    activation_checkpointing: true
  msa_args:
    msa_s: 64
    msa_blocks: 4
    msa_dropout: 0.15
    z_dropout: 0.25
    miniformer_blocks: false
    pairwise_head_width: 32
    pairwise_num_heads: 4
    use_paired_feature: true
    activation_checkpointing: true
  pairformer_args:
    num_blocks: 64
    num_heads: 16
    dropout: 0.25
    post_layer_norm: false
    activation_checkpointing: true
  diffusion_process_args:
    sigma_min: 0.01
    sigma_max: 160.0
    sigma_data: 16.0
    rho: 40
    P_mean: -1.2
    P_std: 1.5
    gamma_0: 0.0
    gamma_min: 1.0
    noise_scale: 1.0
    step_scale: 1.5
    sampling_schedule: af3
    mse_rotational_alignment: true
    coordinate_augmentation: true
    alignment_reverse_diff: true
    synchronize_sigmas: false
    exp_exact_step: true
